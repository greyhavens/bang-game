dependencies {
  // libGDX excised (Epic 3 Phase 8): the gdx display/input/render backend packages were removed —
  // this fork survives only as the build-time model/particle asset compiler (headless, via
  // DummyDisplaySystem), so no windowing/input backend is needed at all.
  api ("org.lwjgl.lwjgl:lwjgl:2.9.2") {
     exclude group: 'org.lwjgl.lwjgl', module: 'lwjgl-platform'
     exclude group: 'net.java.jinput', module: 'jinput-platform'
  }
  api "org.lwjgl.lwjgl:lwjgl_util:2.9.2"
  // ant is only for tools, so we don't export it as a depend
  compileOnly "org.apache.ant:ant:1.7.1"
}
