// jME3 cutover (Phase 1): app's runtime framework (`com.threerings.jme.*`) sits on jME3 only.
// jme3-core is `api` because app's public API threads jME3 type tokens (Spatial, Node, Camera,
// AnimComposer) through its signatures, which client/shared consumes.
//
// (Epic 4 Phase 5, 2026-07-07: the fork-coupled `modeltool` source set — the old
// XML/model.properties -> fork-binary model.dat compiler — was deleted with the fork `jme`
// module; models bake from committed glTF via tools/j3o-converter's GltfToJ3o instead.)

dependencies {
  api project(":bui")
  api "com.threerings:narya:${naryaVersion}"
  api "com.threerings:nenya:${nenyaVersion}"

  // jME3 is app's only engine on the main (runtime) path; pulled `api` for the type tokens
  // threaded through app's public surface. (bui also exports it; declared here explicitly so
  // app does not rely on a transitive provider.)
  api "org.jmonkeyengine:jme3-core:${jme3Version}"
  // terrain heightmap generators (editor) + post-process effects (fog, etc.)
  api "org.jmonkeyengine:jme3-terrain:${jme3Version}"
  api "org.jmonkeyengine:jme3-effects:${jme3Version}"

  // jME3 cutover (Phase 3): GL11.glGetString for the perf-report GL driver identity (read on the
  // render thread by JmeApp.getGLRendererString). compileOnly — the natives reach runtime via the
  // client/desktop jme3-lwjgl3 dependency.
  compileOnly "org.lwjgl:lwjgl-opengl:3.3.6"
  // jME3 cutover (Phase 3): glfwSetWindowIcon for the application/window+taskbar icon, installed
  // on the render thread by JmeApp.setWindowIcons (replaces the fork's LWJGL2 Display.setIcon).
  // compileOnly — the lwjgl-glfw classes + natives reach runtime via client/desktop's jme3-lwjgl3.
  compileOnly "org.lwjgl:lwjgl-glfw:3.3.6"

  // these are only for tools, so we don't export them as depends
  compileOnly "com.threerings:nenya-tools:${nenyaVersion}"
  compileOnly "org.apache.ant:ant:1.7.1"
  compileOnly "commons-digester:commons-digester:2.1"
}
