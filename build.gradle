plugins {
  // OWASP dependency-check (Epic 3 Phase 5): scans the RESOLVED classpath — including the
  // transitive deps our forked jars drag in, which Dependabot cannot see — against the NVD.
  // Run via `./gradlew dependencyCheckAggregate`.
  id "org.owasp.dependencycheck" version "12.2.2"
}

allprojects {
  group = "com.threerings"
  version = "1.1.0"

  ext {
    // Three Rings / samskivert stack versions, centralised here (Epic 2 Phase 1) so any single lib
    // can be forked + locally republished + swapped via a one-line change. mavenLocal() is first in
    // `repositories`, so a locally-published `com.x:lib:<ver>-bang1` transparently wins.
    naryaVersion = "1.22"  // + GenStreamableTask flatten mode / GenStreamUtil for ART field-order (Epic A1 Phase 5)
    nenyaVersion = "1.7.2"
    // 1.7.2-android1: regenerated flatten streamers + narya 1.22 dep (Epic A1 Phase 5). New
    // coordinates, not a 1.7.1 republish — the 2026-07-06 poisoned-vilya incident rule.
    vilyaVersion = "1.7.2-android1"
    depotVersion = "1.8"
    samskivertVersion = "1.11"
    oooUtilVersion = "1.5"
    oooUserVersion = "1.5.2"
    // getdown bumped 1.4 -> 1.8.10 (Epic 2 Phase 2): the applet-era 1.4 won't build on JDK 21
    // (netscape.javascript.JSObject / source 1.5); modern getdown dropped applets and split into
    // getdown-core/launcher/ant — Bang only needs getdown-core (LaunchUtil).
    getdownVersion = "1.8.10"
    // The authoritative module→version pin map for the fork-owned stack, derived from the
    // versions above. Consumed twice: force()d onto every configuration below (so transitive
    // poms can never hoist past a pin) and checked by the root `verifyDependencyPins` task
    // (CI + deploy gate). Tools artifacts intentionally share their lib's version.
    forkPins = [
      "com.threerings:narya"               : naryaVersion,
      "com.threerings:narya-tools"         : naryaVersion,
      "com.threerings:nenya"               : nenyaVersion,
      "com.threerings:nenya-tools"         : nenyaVersion,
      "com.threerings:vilya"               : vilyaVersion,
      "com.threerings:ooo-util"            : oooUtilVersion,
      "com.threerings:ooo-user"            : oooUserVersion,
      "com.samskivert:samskivert"          : samskivertVersion,
      "com.samskivert:depot"               : depotVersion,
      "com.threerings.getdown:getdown-core": getdownVersion,
    ]
    // Flyway schema migrations (Epic 3 Phase 7) — core + the MySQL dialect module (split out
    // of core since Flyway 10)
    flywayVersion = "11.8.2"
    // jME3 is used only by the isolated Phase 5 tool modules + the (dormant, compileOnly)
    // jME3 BUI backend — centralised so a cutover bump can't leave modules on mismatched
    // versions (which would crash at runtime once they share a classpath)
    jme3Version = "3.9.0-stable"
    towns = [ "frontier_town", "indian_post" ]
    // indicates whether we're building for test or production
    // when "package" target is invoked the deployment will be set to "prod"
    deployment = "test"
  }

  apply plugin: "java-library"

  java {
    toolchain {
      languageVersion = JavaLanguageVersion.of(21)
    }
  }

  tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs << '-Xlint:all' << '-Xlint:-serial' << '-Xlint:-path' << '-Xlint:-overrides'
  }

  configurations {
    tools
    // "compileOnly" replaces the legacy custom "provided" configuration, which was also added
    // to the test compile and runtime classpaths; preserve that behavior
    testImplementation.extendsFrom compileOnly
  }

  // CVE forces applied to EVERY module (Epic 3 Phase 5b) — resolutionStrategy.force is per-project,
  // so these must live in allprojects, not in :server, to also cover :app (which pulls commons-
  // beanutils via commons-digester 2.1) and :tools (which pulls protobuf-java via project(":server")).
  configurations.all {
    resolutionStrategy {
      // Fork-stack pins are FORCED, not just requested (2026-07-06 incident: an in-place vilya
      // 1.7.1 republish to the shared mavenLocal carried a pom depending on narya 1.22, which
      // highest-version-wins resolution silently hoisted past the pin — narya 1.22's codegen'd
      // BodyObject.writeObject nulled every PlayerObject field over the wire). force() makes the
      // ext-block pin authoritative regardless of what any transitive pom asks for.
      forkPins.each { module, pinned -> force "${module}:${pinned}" }
      // digester 2.1 would pull commons-beanutils 1.8.3; 1.11.0 clears CVE-2014-0114 + CVE-2019-10086
      // + CVE-2025-48734 (BeanIntrospector suppression bypass via declaredClass, fixed in 1.11.0)
      force "commons-beanutils:commons-beanutils:1.11.0"
      // mysql-connector-j 8.4.0 pulls protobuf-java 3.25.1; 3.25.5 clears CVE-2024-7254 (parse DoS)
      force "com.google.protobuf:protobuf-java:3.25.5"
      // flyway-core 11.8.2 pulls jackson 2.15.2; 2.21.4 clears CVE-2026-54512/CVE-2026-54513
      // (BasicPolymorphicTypeValidator bypasses, fixed in 2.18.8/2.21.4) — the first catch by the
      // now-gating OWASP scan. core/annotations forced alongside to keep the family aligned.
      force "com.fasterxml.jackson.core:jackson-databind:2.21.4"
      force "com.fasterxml.jackson.core:jackson-core:2.21.4"
      // annotations doesn't ship patch releases anymore — plain "2.21" is the 2.21.x line's version
      force "com.fasterxml.jackson.core:jackson-annotations:2.21"
    }
  }

  dependencies {
    tools "com.threerings:narya-tools:${naryaVersion}"
    if (project.path != ":tools") {
      tools project(":tools")
    }
  }

  repositories {
    mavenLocal()
    // Our forked Three Rings / samskivert stack, published to GitHub Packages (Epic 2 Phase 2).
    // Ordered ahead of mavenCentral so our source-built copies win for these coordinates; creds come
    // from ~/.gradle/gradle.properties (gpr.user/gpr.token) or the GITHUB_ACTOR/GITHUB_TOKEN env
    // (CI), never hardcoded. Resolves nothing else, so the rest still comes from Central.
    maven {
      name = "githubBang"
      url = uri("https://maven.pkg.github.com/claridtimo/bang-game")
      credentials {
        username = (project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR"))?.toString()
        password = (project.findProperty("gpr.token") ?: System.getenv("GITHUB_TOKEN"))?.toString()
      }
    }
    mavenCentral()
  }
}

// Pin gate (2026-07-06 vilya/narya incident hardening): resolve the two deployable classpaths and
// fail if ANY com.threerings/com.samskivert artifact resolved to a version other than its forkPins
// pin (or isn't pinned at all). With the force() above in place this should never trip — it is the
// backstop for the day the force is edited, bypassed, or a new fork coordinate appears unpinned.
// Runs in CI's build job and gates every local `deploy` (below), so a poisoned mavenLocal can
// never ship a dev build again. Graph-only resolution, so it costs almost nothing.
// Resolution providers are captured lazily at configuration time (Task.project at execution time
// is deprecated); rootComponent is graph-only, so querying it never downloads artifacts.
def pinnedVersions = forkPins
def pinCheckedGraphs = [":server", ":client:shared"].collectEntries { path ->
  [(path): project(path).configurations.named("runtimeClasspath")
      .flatMap { it.incoming.resolutionResult.rootComponent }]
}
tasks.register("verifyDependencyPins") {
  group = "verification"
  description = "Fails if any fork-stack (com.threerings/com.samskivert) artifact resolves off its pin."
  doLast {
    def problems = []
    pinCheckedGraphs.each { path, rootComponent ->
      def seen = [] as Set
      def stack = [rootComponent.get()]
      while (!stack.empty) {
        def comp = stack.pop()
        def id = comp.id
        if (!seen.add(id)) continue
        comp.dependencies.each { dep ->
          if (dep instanceof org.gradle.api.artifacts.result.ResolvedDependencyResult) {
            stack << dep.selected
          }
        }
        if (!(id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier)) continue
        def watched = ["com.threerings", "com.samskivert"].any {
          id.group == it || id.group.startsWith(it + ".")
        }
        if (!watched) continue
        def key = "${id.group}:${id.module}".toString()
        def pinned = pinnedVersions[key]
        if (pinned == null) {
          problems << "${path} runtimeClasspath: ${key}:${id.version} is not in forkPins — add a pin if intentional"
        } else if (id.version != pinned) {
          problems << "${path} runtimeClasspath: ${key} resolved to ${id.version} but is pinned to ${pinned}"
        }
      }
    }
    if (!problems.empty) {
      throw new GradleException(
        "Dependency pin verification FAILED — resolved fork-stack versions disagree with the pins in build.gradle:\n  " +
        problems.join("\n  ") +
        "\nLikely cause: a stale or in-place-republished artifact in mavenLocal (~/.m2) whose pom hoists a " +
        "transitive version past its pin (see the 2026-07-06 vilya→narya incident). Inspect with:\n" +
        "  ./gradlew :server:dependencies --configuration runtimeClasspath")
    }
  }
}

// Every module's `deploy` AND `check` passes the pin gate first — local deploys resolve
// mavenLocal-first, which is exactly the surface the 2026-07-06 incident poisoned (CI was
// unaffected; it resolves from GitHub Packages). `check` too (#55 review) so a bare
// `./gradlew build`/`test` surfaces drift the day it happens instead of silently force-masking it.
def pinGate = tasks.named("verifyDependencyPins")
subprojects {
  tasks.configureEach { if (name == "deploy" || name == "check") dependsOn pinGate }
}

// OWASP dependency-check scan config (root-level; dependencyCheckAggregate spans all modules).
dependencyCheck {
  formats = ["HTML", "JSON"]
  // fail on any High/Critical (CVSS >= 7.0); Medium/Low are report-only
  failBuildOnCVSS = 7.0f
  suppressionFile = "config/owasp-suppressions.xml"
  // keep the NVD database OUT of GRADLE_USER_HOME: in CI, gradle/actions/setup-gradle caches
  // ~/.gradle per job, and its default location (~/.gradle/dependency-check-data) let a failed
  // scan's partial/locked H2 database circulate via the gradle-home cache and poison later runs
  // ("Unable to obtain an exclusive lock" / "No documents exist"). security.yml caches this
  // directory itself, win or lose.
  data {
    directory = "${System.getProperty('user.home')}/dependency-check-data"
  }
  // the NVD feed now requires an API key to avoid aggressive throttling; supplied in CI via the
  // NVD_API_KEY secret. Locally it falls back to unauthenticated (slow) updates if unset.
  nvd {
    apiKey = System.getenv("NVD_API_KEY")
  }
  analyzers {
    // pure-Java project: disable the irrelevant analyzers to cut noise and runtime
    assemblyEnabled = false
    nodeAuditEnabled = false
    nodeEnabled = false
    nuspecEnabled = false
  }
}
