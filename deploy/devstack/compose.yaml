# Epic 3 Phase 2 — containerized devtest: a seeded MySQL + a BangServer (frontier_town) node.
#
# Brings up the same runtime bin/bangserver does, from the host's `./gradlew deploy` output
# (bind-mounted read-only) so "works on my machine" and the container converge — no custom image to
# rebuild when game code changes (just re-deploy on the host + restart the server service).
#
#   ./gradlew deploy                                   # build server jars + staged assets (host)
#   podman-compose -f deploy/devstack/compose.yaml up  # bring up MySQL + the server node
#
# The entrypoint appends env-derived overrides (DB host, server_root, mgmt endpoint) to the
# mounted server.properties — see entrypoint.sh for why a file rather than the BANG_* env bridge.
# podman-compose 1.0.6 uses per-container networking (service-name DNS), hence DB_HOST=mysql below.
name: bang-devstack

services:
  mysql:
    image: docker.io/library/mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: devstack-root
    volumes:
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro,z
      - bang-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pdevstack-root"]
      interval: 5s
      timeout: 5s
      retries: 30

  server:
    image: docker.io/library/eclipse-temurin:21-jre
    depends_on:
      mysql:
        condition: service_healthy
    working_dir: /bang
    environment:
      # podman-compose uses per-container networking (service-name DNS), not a shared pod, so the
      # server reaches MySQL at the `mysql` service name, not localhost. The entrypoint appends
      # env-derived overrides (jdbc URLs -> ${DB_HOST}, server_root, mgmt endpoint) to the baked
      # server.properties.
      DB_HOST: mysql
      BANG_SERVER_MGMT_PORT: "8081"
    volumes:
      - ../../build/server:/bang/build/server:ro,z
      - ../../assets/build/staging:/bang/assets/build/staging:ro,z
      - ../../data:/bang/data:ro,z                     # ${server_root}/data/boards — the 165 boards loaded at startup
      # the one writable spot under data/: soundtrack-download symlinks + stamp files
      # (PlayerManager.createDownloadSymlink, a live client RPC) — writable volume over the ro mount
      - bang-downloads:/bang/data/downloads
      - ../../etc/test/server.properties:/bang/conf-src/server.properties:ro,z
      # TLS material (bin/gen-tls-certs output) for transport-TLS runs: server.properties points
      # server_tls_keystore at /bang/etc-test/tls-server.p12. Harmless when server_tls is off
      # (the dir mounts empty-ish; nothing reads it).
      - ../../etc/test:/bang/etc-test:ro,z
      - ./entrypoint.sh:/bang/entrypoint.sh:ro,z
    command: ["bash", "/bang/entrypoint.sh"]
    # liveness via the Phase-6 management endpoint: /health answers 200 only once BangServer.init
    # fully completed (it is started last) and the connection manager is running. The probe script
    # is written by entrypoint.sh (the JRE image has no curl/wget, and this command must stay
    # quote-free: podman-compose 1.0.6 mangles quoted CMD lists and healthchecks run under dash).
    # `compose up --wait` (the CI integration gate) blocks on this, so a server that boots but
    # never becomes healthy fails CI.
    healthcheck:
      test: ["CMD-SHELL", "bash /bang/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 60          # boards/avatar bundles make first boot slow; allow ~5 min + start_period
      start_period: 30s
    ports:
      - "47624:47624"   # Narya client port (so a host client / the bot can connect)

volumes:
  bang-db:
  bang-downloads:
