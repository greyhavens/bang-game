dependencies {
  api project(":client:shared")
  api "com.samskivert:depot:${depotVersion}"
  // 1.5.1 is the first ooo-user built against depot 1.8 (1.4.5 calls removed
  // ColumnExp.in signatures and fails at runtime with NoSuchMethodError)
  api "com.threerings:ooo-user:${oooUserVersion}"
  // ehcache 1.6.0 is EOL but kept: it's depot 1.8's L2 cache and 2.x is an API-incompatible
  // major jump. No CVE pins to 1.6.0 given our usage (single-JVM, no RMI replication listener,
  // trusted local ehcache.xml). Tracked for a coordinated bump with a depot compat check.
  api "net.sf.ehcache:ehcache:1.6.0"
  // 8.4.0 (LTS) fixes CVE-2023-22102 (connection takeover) and pulls a patched protobuf-java
  runtimeOnly "com.mysql:mysql-connector-j:8.4.0"
  // digester 2.1 keeps the org.apache.commons.digester package (drop-in; 3.x renames to
  // digester3) but pulls commons-beanutils 1.8.3 + commons-logging 1.1.1, which mark log4j /
  // logkit / avalon / servlet-api as OPTIONAL — dropping the EOL log4j 1.2.12 chain off runtime.
  api "commons-digester:commons-digester:2.1"
}
// NB: the commons-beanutils/protobuf-java version forces live in the ROOT build.gradle's
// allprojects block — a resolutionStrategy.force here would only apply to :server, leaving the
// vulnerable versions in :app (beanutils) and :tools (protobuf, via project(":server")).

// bake the deployment configs into our jar alongside our other resources
processResources {
  from("../etc/${deployment}") {
    include "deployment.properties"
    include "server.properties"
  }
}

tasks.register("createTestUserAccount", JavaExec) {
  systemProperty "ooo.propfile", "server"
  args(["create", "test", "yeehaw", "test@test.com"])
  mainClass = "com.threerings.user.tools.UserTool"
  classpath = sourceSets.main.runtimeClasspath
}

tasks.register("setTestUserBirthday", JavaExec) {
  systemProperty "ooo.propfile", "server"
  // give the test user a birthday well over 13 years ago; without one the auth server's
  // COPPA gate treats the account as under 13 and blocks it from the multiplayer game
  args(["test", "1990-01-01"])
  mainClass = "com.threerings.bang.server.tools.SetUserBirthday"
  classpath = sourceSets.main.runtimeClasspath
  mustRunAfter "createTestUserAccount"
}

tasks.register("createTestUser") {
  description = "Create user test/yeehaw (with an over-13 birthday) in the user DB."
  dependsOn "createTestUserAccount", "setTestUserBirthday"
}

tasks.register("deploy", Sync) {
  from jar
  from configurations.runtimeClasspath
  into project.file("../build/server")
}
