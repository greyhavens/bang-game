name: CI

# Epic 3 CI. `build` (Phase 1): compile + unit-test all modules on JDK 21. `integration` (Phase 3):
# stand up the containerized devstack (MySQL + a BangServer node) and run the headless Narya bot
# smoke test — a full-stack assertion that an all-AI game reaches GAME_OVER with a winner.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  packages: read   # resolve the forked Three Rings / samskivert stack from GitHub Packages

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build & test
        env:
          # Bang's build.gradle reads these for the githubBang Maven repo (the forked deps live in
          # this repo's GitHub Packages); the Actions GITHUB_TOKEN has packages:read here.
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

  gltf-validate:
    name: glTF validity (Khronos validator)
    # The round-trip parity harness proves the Epic-4 glTF writer is a LOSSLESS container (its own
    # reader mirrors its writer) but cannot catch spec violations a viewer/Blender would reject —
    # three such (raw texture path, empty-channel animation, unencoded URI) were caught by hand in
    # #48 review. This job automates that: check the COMMITTED glTF corpus is fresh (matches a
    # deterministic regeneration from the .mxml, while those still exist), then run the official
    # Khronos validator over it, failing on any Error-severity issue.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Phase 4 staging: the glTF corpus is now COMMITTED in assets/rsrc as the future canonical
      # source. While the .mxml sources still exist (the cutover merge deletes them), regenerate
      # from them and byte-compare against the committed tree — the writer is deterministic, so
      # any diff means a .mxml was edited without re-running mxmlToGltf, or a committed .gltf was
      # edited by hand. This freshness step retires with the .mxml at the cutover.
      - name: Freshness — regenerated glTF must match the committed corpus
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :tools:j3o-converter:mxmlToGltf -PallModels \
            -Pout="$GITHUB_WORKSPACE/gltf-out" --no-daemon --stacktrace
          cd "$GITHUB_WORKSPACE/gltf-out"
          fail=0
          while IFS= read -r f; do
            if ! cmp -s "$f" "$GITHUB_WORKSPACE/assets/rsrc/$f"; then
              echo "::error::stale committed glTF (differs from .mxml regeneration): assets/rsrc/$f"
              fail=1
            fi
          done < <(find . -type f \( -name '*.gltf' -o -name '*.bin' \) | sed 's|^\./||')
          exit $fail

      - name: Install the Khronos glTF-Validator
        run: npm install --prefix deploy/ci/gltf-validate

      - name: Validate the committed glTF corpus
        # texture PNGs are already co-located in the source tree, so image URIs resolve in place
        run: node deploy/ci/gltf-validate/validate.js "$GITHUB_WORKSPACE/assets/rsrc"

  integration:
    name: Integration smoke (bot vs AI game)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate etc/test config (from etc/*.dist)
        run: bash deploy/devstack/gen-etc-test.sh

      - name: Build (deploy server jars + staged assets)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew deploy --no-daemon --stacktrace

      - name: Bring up devstack (MySQL + BangServer)
        run: docker compose -f deploy/devstack/compose.yaml up -d --wait

      - name: Wait for the server to listen on 47624
        run: |
          for i in $(seq 1 90); do
            if (echo > /dev/tcp/localhost/47624) 2>/dev/null; then echo "server listening"; exit 0; fi
            sleep 2
          done
          echo "::error::server never started listening on 47624"
          docker compose -f deploy/devstack/compose.yaml logs server
          exit 1

      - name: Bot smoke test (all-AI game must reach GAME_OVER)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :tools:bot-client:run -Phost=localhost -Ptimeout=240 --no-daemon

      - name: Server logs on failure
        if: failure()
        run: docker compose -f deploy/devstack/compose.yaml logs --tail=300 server

      - name: Tear down
        if: always()
        run: docker compose -f deploy/devstack/compose.yaml down -v

  # The OWASP dependency scan lives in its own workflow (security.yml): this workflow's
  # cancel-in-progress concurrency would kill the in-flight master scan (and its NVD cache save)
  # on every merge. It is GATING there — see security.yml for the details.
