name: CI

# Epic 3 CI. `build` (Phase 1): compile + unit-test all modules on JDK 21. `integration` (Phase 3):
# stand up the containerized devstack (MySQL + a BangServer node) and run the headless Narya bot
# smoke test — a full-stack assertion that an all-AI game reaches GAME_OVER with a winner.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  packages: read   # resolve the forked Three Rings / samskivert stack from GitHub Packages

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build & test
        env:
          # Bang's build.gradle reads these for the githubBang Maven repo (the forked deps live in
          # this repo's GitHub Packages); the Actions GITHUB_TOKEN has packages:read here.
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

  integration:
    name: Integration smoke (bot vs AI game)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate etc/test config (from etc/*.dist)
        run: bash deploy/devstack/gen-etc-test.sh

      - name: Build (deploy server jars + staged assets)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew deploy --no-daemon --stacktrace

      - name: Bring up devstack (MySQL + BangServer)
        run: docker compose -f deploy/devstack/compose.yaml up -d --wait

      - name: Wait for the server to listen on 47624
        run: |
          for i in $(seq 1 90); do
            if (echo > /dev/tcp/localhost/47624) 2>/dev/null; then echo "server listening"; exit 0; fi
            sleep 2
          done
          echo "::error::server never started listening on 47624"
          docker compose -f deploy/devstack/compose.yaml logs server
          exit 1

      - name: Bot smoke test (all-AI game must reach GAME_OVER)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :tools:bot-client:run -Phost=localhost -Ptimeout=240 --no-daemon

      - name: Server logs on failure
        if: failure()
        run: docker compose -f deploy/devstack/compose.yaml logs --tail=300 server

      - name: Tear down
        if: always()
        run: docker compose -f deploy/devstack/compose.yaml down -v

  security-scan:
    name: Dependency vulnerability scan (OWASP)
    runs-on: ubuntu-latest
    # NON-GATING for now (continue-on-error): the scan reports but never blocks a PR. Flip this off
    # once the NVD_API_KEY secret is set and the baseline is confirmed clean, so it gates PRs on
    # High/Critical CVEs (the build.gradle dependencyCheck config already sets failBuildOnCVSS=7.0).
    # Prereq: `gh secret set NVD_API_KEY` (get a free key at https://nvd.nist.gov/developers/request-an-api-key).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # rotate the cache key weekly: a per-run key (github.run_id) never hits, so every run would
      # save a fresh multi-hundred-MB NVD DB and never reuse/evict-in-place, pressuring the repo
      # cache quota. Weekly rotation reuses within a week (restore-keys falls back to the prior
      # week's DB, which the plugin then delta-updates) and saves the refreshed DB under the new key.
      - name: Compute weekly NVD cache key
        id: nvdkey
        run: echo "week=$(date -u +%Y-%U)" >> "$GITHUB_OUTPUT"

      - name: Cache the NVD database
        uses: actions/cache@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-${{ runner.os }}-${{ steps.nvdkey.outputs.week }}
          restore-keys: nvd-${{ runner.os }}-

      - name: OWASP dependency-check (aggregate)
        env:
          # resolve the forked stack from GitHub Packages, same as the build job
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # avoids NVD throttling; job is non-gating until this is set
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAggregate --no-daemon --stacktrace

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: '**/build/reports/dependency-check-report.*'
          if-no-files-found: ignore
