dependencies {
  api project(":client:shared")
  api project(":tools")
}

ext {
  stagingDir = "build/staging"
}

tasks.register("copyResources", Copy) {
  from "."
  into stagingDir
  include "rsrc/**"
  exclude "rsrc/avatars/**"
  exclude "rsrc/bonuses/**"
  exclude "rsrc/cards/**"
  exclude "rsrc/config/**/*.xml"
  exclude "rsrc/effects/**"
  exclude "rsrc/extras/**"
  exclude "rsrc/props/**"
  exclude "rsrc/sounds/**"
  exclude "rsrc/tutorials/**/*.xml"
  exclude "rsrc/units/**"
  exclude "rsrc/**/*.wav"
}
processResources.dependsOn "copyResources"

tasks.register("copyOggs", Copy) {
  from "."
  into stagingDir
  include "rsrc/**/*.ogg"
}
processResources.dependsOn "copyOggs"

tasks.register("copyTownBits", Copy) {
  from "."
  into stagingDir
  include "rsrc/bonuses/**/*.png"
  include "rsrc/bonuses/**/bonus.properties"
  include "rsrc/cards/**/*.png"
  include "rsrc/effects/**/*.png"
  include "rsrc/effects/**/icon.properties"
  include "rsrc/effects/**/icons.txt"
  include "rsrc/effects/**/particles.j3o"
  include "rsrc/effects/**/particles.properties"
  include "rsrc/effects/**/particles.txt"
  include "rsrc/extras/**/*.png"
  include "rsrc/props/**/*.png"
  include "rsrc/props/**/prop.properties"
  include "rsrc/units/**/*.png"
  include "rsrc/units/**/unit.properties"
}
processResources.dependsOn "copyTownBits"

tasks.register("genConfigs") {
  dependsOn configurations.tools
  doLast {
    ant.taskdef(classpath: configurations.tools.asPath, name: "confcomp",
                classname: "com.threerings.tools.CompiledConfigTask")

    // compiles our tutorial XML definitions
    ant.confcomp(dest: stagingDir,
                 parser: "com.threerings.bang.game.tools.xml.TutorialConfigParser") {
      fileset(dir: "rsrc/tutorials", includes: "**/*.xml")
    }

    // creates the serialized color repository config
    ant.confcomp(dest: stagingDir,
                 parser: "com.threerings.media.image.tools.xml.ColorPositoryParser",
                 configdef: "rsrc/config/media/colordefs.xml")
    // creates the serialized article and aspect catalogs
    ant.confcomp(dest: stagingDir,
                 parser: "com.threerings.bang.avatar.tools.xml.ArticleCatalogParser",
                 configdef: "rsrc/avatars/articles.xml")
    ant.confcomp(dest: stagingDir,
                 parser: "com.threerings.bang.avatar.tools.xml.AspectCatalogParser",
                 configdef: "rsrc/avatars/aspects.xml")
    ant.confcomp(dest: stagingDir,
                 parser: "com.threerings.bang.avatar.tools.xml.BucklePartCatalogParser",
                 configdef: "rsrc/avatars/buckle_parts.xml")
  }
}
processResources.dependsOn "genConfigs"

// builds the avatar component bundles
tasks.register("genBundles") {
  dependsOn configurations.tools
  doLast {
    ant.taskdef(classpath: configurations.tools.asPath, name: "metabundle",
                classname: "com.threerings.cast.bundle.tools.MetadataBundlerTask")

    def avatarDir = project.file(stagingDir + "/rsrc/avatars")
    avatarDir.mkdirs()

    ant.metabundle(actiondef: "rsrc/avatars/actions.xml", classdef: "rsrc/avatars/classes.xml",
                   target: "${avatarDir}/metadata.jar")

    ant.taskdef(classpath: configurations.tools.asPath, name: "cbundle",
                classname: "com.threerings.cast.bundle.tools.ComponentBundlerTask")

    towns.each { town ->
      [ "male", "female" ].each { sex ->
        def townDir = "rsrc/avatars/${town}"
        // <mkdir dir="${deploy.dir}/rsrc/avatars/${comp.bundle}"/>
        ant.cbundle(actiondef: "rsrc/avatars/actions.xml", mapfile: "rsrc/avatars/compmap.txt",
                    root: townDir,
                    target: "${stagingDir}/${townDir}/${sex}/components.jar") {
          fileset(dir: "${townDir}/${sex}") {
            include(name: "**/*.png")
            exclude(name: "**/*_shadow.png")
            exclude(name: "**/*_crop.png")
            exclude(name: "components/**")
          }
        }
      }
    }

    ant.cbundle(actiondef: "rsrc/avatars/actions.xml", mapfile: "rsrc/avatars/compmap.txt",
                root: "rsrc/avatars/",
                target: "${avatarDir}/buckle/components.jar") {
      fileset(dir: "rsrc/avatars/buckle") {
        include(name: "**/*.png")
        exclude(name: "**/*_crop.png")
        exclude(name: "components/**")
      }
    }
  }
}
processResources.dependsOn "genBundles"

// Models: the COMMITTED rsrc/**/model.gltf (the canonical source since the Epic 4 Phase 4
// cutover, 2026-07-07; editable in Blender per docs/blender-authoring.md) bake straight to
// staged model.j3o via tools:j3o-converter:bakeModelsGltf (GltfToModelDef -> MxmlToJ3o, the
// parity-verified pipeline). GltfToJ3o's own model.properties-vs-model.gltf completeness check
// fails the build if any model lacks its glTF. Committed prop heights are frozen (the old
// UpdatePropHeightTask was already a no-op in this build). Epic 4 Phase 5 (2026-07-07) deleted
// the legacy fork path (.mxml -> model.dat -> .j3o, the -PmodelSource=mxml escape hatch) with
// the fork itself; no .dat intermediate exists anywhere anymore. `compileModels` survives as the
// anchor name other tasks order against.
evaluationDependsOn(":tools:j3o-converter")
def bakeModelsTask = project(":tools:j3o-converter").tasks.named("bakeModelsGltf")
tasks.register("compileModels") {
  finalizedBy bakeModelsTask
}
bakeModelsTask.configure { mustRunAfter ":assets:compileModels" }
processResources.dependsOn "compileModels"
processResources.dependsOn bakeModelsTask

// Epic 4 Phase 4½a FREEZE (2026-07-07): particle effects are committed rsrc/effects/**/
// particles.j3o (the final verified Phase-6a bakeParticles output, frozen as source — see
// docs/epic4-native-model-toolchain.md Phase 4½), staged by copyTownBits like any other
// resource. The fork-binary particles.jme sources were deleted (git history preserves them;
// the committed particles-src.json enrichment dumps carry everything re-authoring needs) and
// NOTHING in the build invokes the fork bakeParticles path anymore — the fork's build role is
// zero, unblocking the Phase-5 fork deletion. Re-authoring each frozen .j3o as an editable
// jME3 emitter source proceeds effect-by-effect post-Phase-5.

// generates lists of props, units, etc.
tasks.register("updateLists", Exec) {
  // the list generation expects the staging area to have been populated
  mustRunAfter "copyResources", "copyOggs", "copyTownBits", "genConfigs", "genBundles",
               "compileModels"
  commandLine "./update_lists", stagingDir, towns.join(",")
}
processResources.dependsOn "updateLists"

// package our assets into a bunch of jar files
tasks.register("generalJar", Jar) {
  dependsOn processResources
  from stagingDir
  include "rsrc/**"
  exclude "**/frontier_town/**"
  exclude "**/indian_post/**"
  exclude "**/boom_town/**"
  exclude "**/*.jar"
  archiveBaseName = "general"
}
jar.dependsOn "generalJar"
towns.each { town ->
  tasks.register("${town}_jar", Jar) {
    dependsOn processResources
    from stagingDir
    include "rsrc/**/$town/**"
    exclude "**/*.jar"
    archiveBaseName = "$town"
  }
  jar.dependsOn "${town}_jar"
}

tasks.register("deploy", Sync) {
  from("build/libs", stagingDir)
  include "**/*.jar"
  // the assets module's own (empty) java jar is meaningless to the client; ship only the
  // general/per-town resource jars and the avatar bundles under rsrc/
  exclude "assets-*.jar"
  into "../build/assets"
  includeEmptyDirs = false
}
deploy.dependsOn "build"
